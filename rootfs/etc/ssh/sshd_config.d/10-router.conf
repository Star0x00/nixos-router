# Listen on the LAN side only, matching the previous NixOS setup
ListenAddress 10.10.10.1

# Key-only login for root; no password is baked into the image.
PermitRootLogin prohibit-password

# Fedora's default is ".ssh/authorized_keys" only. The image ships the root key
# under /etc/ssh/authorized_keys/root (readable before any home dir exists), so
# add that location. Keep the default so router-adduser's per-user keys work.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
