APP_NAME = Forgejo
RUN_USER = forgejo
WORK_PATH = /var/lib/forgejo

[server]
PROTOCOL = http
DOMAIN = 10.10.10.1
ROOT_URL = http://10.10.10.1:3000/
HTTP_ADDR = 10.10.10.1
HTTP_PORT = 3000
DISABLE_SSH = false
SSH_PORT = 22

[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/data/forgejo.db

[repository]
ROOT = /var/lib/forgejo/data/repositories

[service]
DISABLE_REGISTRATION = true

[packages]
ENABLED = true

[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = github
