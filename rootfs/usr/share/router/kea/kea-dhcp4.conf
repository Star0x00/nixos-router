{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "enp0s20f0u1" ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp4.leases"
    },
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "valid-lifetime": 4000,
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.10.10.0/24",
        "pools": [ { "pool": "10.10.10.2 - 10.10.10.100" } ],
        "option-data": [
          { "name": "routers", "data": "10.10.10.1" },
          { "name": "domain-name-servers", "data": "10.10.10.1" },
          { "name": "subnet-mask", "data": "255.255.255.0" },
          { "name": "broadcast-address", "data": "10.10.10.255" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "syslog",
            "pattern": "%d{%Y.%m.%d %H:%M:%S.%q} %-5p [%c/%i] %m\n"
          }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
