#!/usr/sbin/nft -f
# WAN firewall: allow established connections and traffic initiated by the LAN.
# Transparent proxying / DNS will be handled in eBPF later; no TPROXY rules here.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
        ct state { established, related } accept
        iifname "lo" accept
        iifname "enp0s20f0u1" accept
        iifname "eno1" drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        ct state { established, related } accept
        iifname "enp0s20f0u1" oifname "eno1" accept
        iifname "eno1" drop
    }
}
