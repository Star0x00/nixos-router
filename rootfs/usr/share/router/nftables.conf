#!/usr/sbin/nft -f
# WAN 防火墙：只放行已建立连接与 LAN 发起流量。
# 透明代理/DNS 由 dae 的 eBPF 处理，这里不做 TPROXY/redirect。
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
        ct state { established, related } accept
        iifname "lo" accept
        iifname "enp0s20f0u1" accept
        iifname "eno1" drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        ct state { established, related } accept
        iifname "enp0s20f0u1" oifname "eno1" accept
        iifname "eno1" drop
    }
}
