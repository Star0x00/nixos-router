[Unit]
# Proxied traffic goes to sing-box's local SOCKS5, so bring it up first.
After=network-online.target sing-box.service
Wants=network-online.target sing-box.service

[Service]
# Asset directory must be writable (dae updates geoip/geosite)
Environment=DAE_LOCATION_ASSET=/var/lib/dae/assets
StateDirectory=dae
ExecStartPre=/usr/share/router/dae/seed-assets.sh
