[Unit]
# Subscriptions come from the local Sub-Store; wait for it before pulling nodes
After=network-online.target sub-store.service
Wants=network-online.target sub-store.service

[Service]
# Asset directory must be writable (dae updates geoip/geosite)
Environment=DAE_LOCATION_ASSET=/var/lib/dae/assets
StateDirectory=dae
ExecStartPre=/usr/share/router/bin/dae-seed-assets.sh
ExecStartPre=/usr/share/router/bin/dae-wait-sub-store.sh
